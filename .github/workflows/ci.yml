name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-typecheck-build:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (web)
        run: pnpm --filter @hosting-platform/web run lint

      - name: Typecheck & build (web)
        run: pnpm --filter @hosting-platform/web run build

      - name: Typecheck & build (api)
        run: pnpm --filter @hosting-platform/api run build
