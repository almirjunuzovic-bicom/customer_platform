# Redis for the SHARED STAGING environment's App VM - see the
# "Appendix: shared staging environment" section of ONBOARDING.md. For
# your own local dev, use `docker-compose.dev.yml` instead. `network_mode:
# host` is required, not optional, on SERVERware VMs: the default bridge
# network needs the kernel's `raw` iptables table, which this platform's
# VM template doesn't have compiled in (confirmed live on AlmirTest - see
# that same appendix). Host networking means no container-to-container
# DNS, so the app connects to Redis via the VM's own private IP or
# 127.0.0.1, not a service name.
services:
  redis:
    image: redis:7-alpine
    network_mode: host
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --bind ${PRIVATE_IP:?set PRIVATE_IP in .env, e.g. 192.168.20.X} 127.0.0.1
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}

volumes:
  redis-data:
